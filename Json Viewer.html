    els.fileInput.click();
  });

  els.fileInput.addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    readFile(f);
    this.value = "";
  });

  function readFile(file) {
    if (file.size > 80 * 1024 * 1024) { toast("文件超过 80MB，可能卡顿"); }
    var reader = new FileReader();
    reader.onload = function () {
      els.input.value = String(reader.result || "");
      parseNow();
      toast("已载入 " + file.name + "（" + fmtSize(file.size) + "）");
    };
    reader.onerror = function () { toast("读取失败"); };
    reader.readAsText(file, "utf-8");
  }

  // 标签切换
  var tabs = document.querySelectorAll(".tab");

  function switchTab(name) {
    state.tab = name;
    Array.prototype.forEach.call(tabs, function (x) {
      x.classList.toggle("on", x.dataset.tab === name);
    });
    var isRaw = name === "raw";
    var isTable = name === "table";
    var isType = name === "type";
    els.raw.classList.toggle("show", isRaw);
    els.tableWrap.classList.toggle("show", isTable);
    els.typeWrap.classList.toggle("show", isType);
    var isTree = !(isRaw || isTable || isType);
    els.tree.style.display = isTree ? "" : "none";
    els.searchbar.style.display = (isRaw || isType) ? "none" : "";
    els.crumbar.style.display = isTable ? "none" : "";
    els.search.style.flex = isTable ? "1 1 auto" : "";
    els.depthGroup.style.display = isTree ? "" : "none";
    document.getElementById("btnExpand").style.display = isTree ? "" : "none";
    document.getElementById("btnCollapse").style.display = isTree ? "" : "none";
    els.btnPrev.style.display = (isTable || isType) ? "none" : "";
    els.btnNext.style.display = (isTable || isType) ? "none" : "";

    if (isRaw) {
      els.raw.textContent = state.hasValue ? JSON.stringify(state.value, null, 2) : "";
    }
    if (isTable) {
      if (!state.tableArr) autoPickTable();
      els.matchInfo.textContent = "";
      renderTable();
    }
    if (isType) renderTypes();
    els.search.placeholder = isTable ? "过滤表格行…（Ctrl+F）"
      : isType ? "搜索…（Ctrl+F）" : "搜索 key 或值…（Ctrl+F）";
  }

  Array.prototype.forEach.call(tabs, function (t) {
    t.addEventListener("click", function () {
      if (t.dataset.tab === "table" && !state.tableArr) autoPickTable();
      switchTab(t.dataset.tab);
    });
  });

  // 主题
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("jv-theme", t); } catch (e) {}
  }
  document.getElementById("btnTheme").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });
  try {
    var saved = localStorage.getItem("jv-theme");
    if (saved) applyTheme(saved);
    var savedMode = localStorage.getItem("jv-typemode");
    if (savedMode) { state.typeMode = savedMode; els.typeMode.value = savedMode; }
  } catch (e) {}

  /* ================= 分栏拖拽 ================= */

  (function () {
    var dragging = false;
    els.gutter.addEventListener("pointerdown", function (e) {
      dragging = true;
      els.gutter.classList.add("drag");
      els.gutter.setPointerCapture(e.pointerId);
      document.body.style.userSelect = "none";
    });
    els.gutter.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var total = document.querySelector(".split").getBoundingClientRect().width;
      var x = e.clientX - document.querySelector(".split").getBoundingClientRect().left;
      var pct = Math.min(70, Math.max(18, (x / total) * 100));
      els.inputPane.style.flex = "0 0 " + pct + "%";
      els.inputPane.style.width = pct + "%";
    });
    function stop() {
      if (!dragging) return;
      dragging = false;
      els.gutter.classList.remove("drag");
      document.body.style.userSelect = "";
      try {
        localStorage.setItem("jv-split", els.inputPane.style.flexBasis || "38%");
      } catch (e) {}
    }
    els.gutter.addEventListener("pointerup", stop);
    els.gutter.addEventListener("pointercancel", stop);
    try {
      var w = localStorage.getItem("jv-split");
      if (w) { els.inputPane.style.flex = "0 0 " + w; els.inputPane.style.width = w; }
    } catch (e) {}
  })();

  /* ================= 拖入文件 ================= */

  var dragDepth = 0;
  window.addEventListener("dragenter", function (e) {
    e.preventDefault();
    dragDepth++;
    document.body.classList.add("dragover");
  });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function (e) {
    e.preventDefault();
    dragDepth--;
    if (dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragover"); }
  });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove("dragover");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  /* ================= 示例数据 ================= */

  var SAMPLE = JSON.stringify({
    code: 0,
    message: "ok",
    data: {
      user: {
        id: 10086,
        name: "Teddy",
        email: "teddy@example.com",
        city: "青岛",
        active: true,
        vip: null,
        tags: ["前端", "全栈", "硬件"],
        profile: {
          birthday: "1995-08-16",
          height: 178,
          github: "https://github.com/teddy",
          bio: "Next.js 全栈开发者，喜欢折腾老机器。"
        }
      },
      orders: [
        { orderId: "A20261123001", amount: 128.5, status: "paid", items: [{ sku: "KB-01", qty: 1 }, { sku: "MS-02", qty: 2 }] },
        { orderId: "A20261123002", amount: 63.0, status: "pending", items: [{ sku: "RAM-DDR3-8G", qty: 1 }] },
        { orderId: "A20261123003", amount: 999.9, status: "refunded", items: [] }
      ],
      meta: { page: 1, pageSize: 20, total: 3, hasNext: false }
    }
  }, null, 2);

  /* ================= 启动 ================= */

  setStatus("等待输入…", "");
  renderAll();
  els.input.focus();
  if (state.raw && !state.hasValue) setStatus("等待输入…", "");

})();
</script>
</body>
</html>
